spring.config.activate.on-profile=prod
spring.datasource.url=${AWS_DATASOURCE_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
aws.s3.bucket-name=todo-bucket-93085605929679205
aws.s3.region=eu-north-1
aws.s3.access-key=${PROD_AWS_ACCESS_KEY}
aws.s3.secret-key=${PROD_AWS_SECRET_KEY}
logging.file.name=/var/log/spring-backend/application-prod.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework.web=ERROR